# Cổng mà API Gateway sẽ lắng nghe các yêu cầu từ bên ngoài
server:
  port: 8080

# Định danh của chính Gateway
spring:
  application:
    name: api-gateway

  # Cấu hình Gateway Routes
  cloud:
    gateway:
      # Cú pháp này đã được cập nhật, không cần server.webflux nữa nếu bạn dùng phiên bản Spring Cloud mới
      routes:
        # === Route 1: Định tuyến đến User Service ===
        - id: identity-service-user
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/user/**
          filters:
            - StripPrefix=2
        # === Route 2: Định tuyến đến Auth Service ===
        - id: identity-service-auth
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=2
    discovery:
      locator:
        enabled: true
        # Chuyển tên service từ dạng CAMEL_CASE sang lower-case-hyphen
        lower-case-service-id: true

  # ← Redis configuration cho Gateway
  data:
    redis:
      port: 6379
      host: localhost
      connect-timeout: 2000ms
# SỬA LẠI CẤU TRÚC EUREKA
eureka:
  instance:
    # Đặt instance-id ở đây
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


app:
  jwt:
    secretKey: 4dVgNvOxWTz2PKJZqCYFoh+AXX0l2OVHoCTfN9ZdXGs=
    open-api-endpoints: /api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh-token,/eureka
