server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 5s

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

  # Redis configuration cho Gateway
  data:
    redis:
      port: 6379
      host: localhost
      connect-timeout: 10000ms

# Buộc Gateway ưu tiên hostname (không dùng IP) khi lấy instance từ Eureka
eureka:
  instance:
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# JWT Configuration
app:
  jwt:
    cookie-max-age: 3600000
    accessTokenExpiration: 3600000
    refreshTokenExpiration: 604800000
    resetTokenExpiration: 300000
    secretKey: 4dVgNvOxWTz2PKJZqCYFoh+AXX0l2OVHoCTfN9ZdXGs=
    resetKey: 4dVgNvOxWTz2PKJZqCYFoh+AXX0l2OVHoCTfN9ZdXGs=
    refreshKey: RKyKtM34VufukHK6sSPlQdDA8wBOHCYUygwIp6Fekco=
    open-api-endpoints: /api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh-token,/eureka
