# Cổng mà API Gateway sẽ lắng nghe các yêu cầu từ bên ngoài
server:
  port: 8080

# Định danh của chính Gateway
spring:
  application:
    name: api-gateway
  # Cấu hình Gateway Routes
  cloud:
    gateway:
      httpclient:
        # Thời gian chờ khi kết nối tới downstream service (ms)
        connect-timeout: 10000
        # Thời gian chờ cho response (cú pháp có thể yêu cầu Duration)
        response-timeout: 5s
      routes:
        # === Route 1: Định tuyến đến User Service ===
        - id: identity-service-user
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/user/**
          filters:
            - StripPrefix=2
        # === Route 2: Định tuyến đến Auth Service ===
        - id: identity-service-auth
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2

        - id: identity-service-address
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/profile/addr/**
          filters:
            - StripPrefix=2

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=2

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/order/**
          filters:
            - StripPrefix=2

        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/api/v1/cart/**
          filters:
            - StripPrefix=2

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payment/**
          filters:
            - StripPrefix=2

    discovery:
      locator:
        enabled: true
        lower-case-service-id: true

  # Redis configuration cho Gateway
  data:
    redis:
      port: 6379
      host: localhost
      connect-timeout: 10000ms

# Buộc Gateway ưu tiên hostname (không dùng IP) khi lấy instance từ Eureka
eureka:
  instance:
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# JWT Configuration
app:
  jwt:
    cookie-max-age: 3600000
    accessTokenExpiration: 3600000
    refreshTokenExpiration: 604800000
    resetTokenExpiration: 300000
    secretKey: 4dVgNvOxWTz2PKJZqCYFoh+AXX0l2OVHoCTfN9ZdXGs=
    resetKey: 4dVgNvOxWTz2PKJZqCYFoh+AXX0l2OVHoCTfN9ZdXGs=
    refreshKey: RKyKtM34VufukHK6sSPlQdDA8wBOHCYUygwIp6Fekco=
    open-api-endpoints: /api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh-token,/eureka
