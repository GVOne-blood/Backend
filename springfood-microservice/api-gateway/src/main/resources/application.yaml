server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 5s

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

  # Redis configuration cho Gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # SSL chỉ bật khi Redis là remote (vd: Upstash). Local Redis không có SSL.
      # Mặc định false; override bằng env REDIS_SSL_ENABLED=true khi cần.
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      # 2s là đủ rộng cho Upstash round-trip khoẻ mạnh và đủ ngắn để không
      # block request pipeline khi Redis cold-start hoặc nghẽn TLS. Application-level
      # blacklist lookup còn có hard timeout 800ms ở AuthenticationFilter để
      # chắc chắn không stall UI.
      timeout: 2000ms
      connect-timeout: 2000ms

# Buộc Gateway ưu tiên hostname (không dùng IP) khi lấy instance từ Eureka
eureka:
  instance:
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# JWT Configuration
app:
  jwt:
    cookie-max-age: 3600000
    accessTokenExpiration: 3600000
    refreshTokenExpiration: 604800000
    resetTokenExpiration: 300000
    secretKey: 4dVgNvOxWTz2PKJZqCYFoh+AXX0l2OVHoCTfN9ZdXGs=
    resetKey: 4dVgNvOxWTz2PKJZqCYFoh+AXX0l2OVHoCTfN9ZdXGs=
    refreshKey: RKyKtM34VufukHK6sSPlQdDA8wBOHCYUygwIp6Fekco=
    open-api-endpoints: /api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/register-with-role,/api/v1/auth/refresh,/api/v1/auth/logout,/eureka
