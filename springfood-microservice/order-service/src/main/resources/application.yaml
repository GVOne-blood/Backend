server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DEFAULT_DATABASE_URL}
    username: ${DEFAULT_DATABASE_USERNAME}
    password: ${DEFAULT_DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: springfood_order
  redis:
    # Redis Cluster 2 - Shared cho các read-heavy services
    shared:
      host: localhost
      port: 6379
      password: ${DEFAULT_DATABASE_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: my-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
security:
  internal:
    auth:
      enabled: false  # Set false để disable authentication (dev only)
      header:
        id: X-User-ID
        username: X-User-Username
        roles: X-User-Role
grpc:
  server:
    port: 9097
  client:
    shop-service:
      address: 'static://localhost:9093'
      negotiation-type: plaintext
    payment-service:
      address: 'static://localhost:9096'
      negotiation-type: plaintext