syntax = "proto3";

package com.viettel.client.authorization;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "authorization/author-common.proto";
import "authorization/application.proto";
import "authorization/tenant.proto";

option java_multiple_files = true;
option java_package = "com.viettel.client.authorization";
option java_outer_classname = "AuthorServiceResource";

service ResourceService {
  rpc createResource (ResourceGrpcDTO) returns (ResourceGrpcDTO) {
  }

  rpc updateResource (ResourceGrpcDTO) returns (ResourceGrpcDTO) {
  }

  rpc getAllResources (SearchParamGrpc) returns (ResourceGrpcDTOListWrapped) {
  }

  rpc deleteResource (CustomPojoRetrieverGrpc) returns (google.protobuf.Empty) {
  }

  rpc deleteAllList (CustomPojoRetrieverGrpc) returns (google.protobuf.Empty) {
  }

  rpc getResource (CustomPojoRetrieverGrpc) returns (ResourceGrpcDTO) {
  }

  rpc doSearch (SearchParamGrpc) returns (ResourceSearchResultGrpc) {
  }

  rpc searchTree (SearchParamGrpc) returns (ResourceTreeGrpcListWrapped) {
  }

  rpc searchChildren (SearchParamGrpc) returns (ResourceGrpcDTOListWrapped) {
  }

  rpc listResourceWithApplicationId (ApplicationIdRequest) returns (ResourceIdListResponse);

  rpc getResourcesByAppIds (AppIdsRequest) returns (ResourceIdListResponse);
}

message ResourceGrpcDTO {
  optional string id = 1;
  optional string resourceName = 2;
  optional string resourceCode = 3;
  optional string description = 4;
  optional string url = 5;
  optional int32 status = 6;
  optional string createdBy = 7;
  optional google.protobuf.Timestamp createdDate = 8;
  optional string lastModifiedBy = 9;
  optional google.protobuf.Timestamp lastModifiedDate = 10;
  optional int32 active = 11;
  string method = 12;
}

message ResourceReplyGrpc {
  optional int32 code = 1;
  optional string message = 2;
  oneof response {
    ResourceGrpcDTO detail = 3;
    string detailErrorMessage = 4;
  }
}

message ResourceSearchResultGrpc {
  repeated ResourceGrpcDTO data = 1;
  optional int32 total = 2;
  optional int32 activeTotal = 3;
  optional int32 inactiveTotal = 4;
  optional int32 searchTotal = 5;
}

message ResourceTreeGrpc {
  optional string id = 1;
  optional string resourceName = 2;
  optional string resourceCode = 3;
  optional string description = 4;
  optional string url = 5;
  optional int32 status = 6;
  optional int32 type = 7;
  optional int32 typeUi = 8;
  optional int32 resource_order = 9;
  optional string icon_menu = 10;
  optional ApplicationGrpcDTO application = 11;
  repeated ResourceTreeGrpc children = 12;
}


message ResourceGrpcDTOListWrapped {
  repeated ResourceGrpcDTO data = 1;
}

message ResourceTreeGrpcListWrapped {
  repeated ResourceTreeGrpc data = 1;
}
message ResourceAccountAddDocumentListWrapped {
  repeated string id = 1;
}

message AppIdsRequest {
  repeated string appIds = 1;
}

message ApplicationIdRequest {
  string appId = 1;
}

message ResourceIdListResponse {
  repeated string resourceIds = 1;
}
