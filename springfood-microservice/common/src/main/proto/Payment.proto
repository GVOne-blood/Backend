syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.theblood.springfood.common.grpc";
//option java_outer_classname = "ProductProto";

service PaymentService {
  rpc PaymentCreation (PaymentRequest) returns (PaymentResponse);
}


message PaymentRequest {
  string userId = 1;
  string amount = 2;
  string transactionStatus = 3;
  string paymentMethod = 4;
}
message PaymentResponse {
  bool success = 1;
  string message = 2;
  string referenceId = 3;
}
