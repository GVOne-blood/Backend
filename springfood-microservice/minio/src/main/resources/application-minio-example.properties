# MinIO Configuration Example
# Copy these properties to your application.properties or application.yml

# Required properties
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=my-bucket

# Optional properties (with default values)
minio.secure=false
minio.connect-timeout=10000
minio.write-timeout=60000
minio.read-timeout=10000
minio.auto-create-bucket=true

# Part size for multipart upload (default: 100MB = 104857600 bytes)
# MinIO uses parallel upload for files larger than this size
# Recommended: 50MB-200MB depending on your network and file sizes
minio.part-size=104857600

# Base URL for generating file URLs (optional)
# If not set, will use endpoint value
# Useful when MinIO is behind a proxy or load balancer
# minio.base-url=https://cdn.yourdomain.com

# Disable MinIO auto-configuration if needed
# minio.enabled=false
