server:
  port: 8084

spring:
  application:
    name: shop-service
  # Load .env file
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://ep-green-dream-a1nsq7ax-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: npg_gpK2ckWJPG4v
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: springfood_shop
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
      ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
      ssl.key.password: ${KAFKA_SSL_KEY_PASSWORD:}
    consumer:
      group-id: shop-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Logging configuration
logging:
  level:
    # Disable JMX/RMI spam logs
    javax.management.remote.rmi: ERROR
    # Disable Kafka connection warnings (when Kafka is not available)
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka.clients.consumer: ERROR
    org.springframework.kafka: ERROR
    # Keep application logs at INFO level
    com.theblood.shopservice: INFO
    root: INFO

grpc:
  server:
    port: 9090
  client:
    product-service:
      address: 'static://localhost:9095'
      negotiationType: PLAINTEXT
