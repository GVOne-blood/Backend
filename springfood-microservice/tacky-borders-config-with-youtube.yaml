watch_config_changes: True
enable_logging: False
rendering_backend: V2

global:
  border_width: 1.5
  border_offset: -1
  border_radius: 10
  border_z_order: AboveWindow
  follow_native_border: True
  initialize_delay: 200
  unminimize_delay: 150

  active_color:
    colors: ["#00d4ff", "#a855f7"]
    direction: 45deg

  inactive_color:
    colors: ["#00d4ff", "#a855f7"]
    direction: 45deg

  animations:
    enabled: False

  effects:
    active:
      - type: Glow
        radius: 12.0
        opacity: 0.7
      - type: Shadow
        radius: 3.0
        opacity: 0.4
        translation:
          x: 0
          y: 2
    inactive:
      - type: Glow
        radius: 12.0
        opacity: 0.7
      - type: Shadow
        radius: 3.0
        opacity: 0.4
        translation:
          x: 0
          y: 2
    enabled: True

window_rules:
  # YouTube PWA - Match by window title (Pure red border) - MUST BE FIRST!
  - match: Title
    name: "YouTube"
    active_color:
      colors: ["#FF0000", "#CC0000"]
      direction: 45deg
    inactive_color:
      colors: ["#FF0000", "#CC0000"]
      direction: 45deg

  # Facebook PWA - Facebook blue (single color)
  - match: Title
    name: "Facebook"
    active_color:
      colors: ["#1877F2", "#166FE5"]
      direction: 45deg
    inactive_color:
      colors: ["#1877F2", "#166FE5"]
      direction: 45deg

  # Google Gemini Pro - Multi-color Google gradient (Blue, Red, Yellow, Green)
  - match: Title
    name: "Gemini"
    active_color:
      colors: ["#4285F4", "#EA4335", "#FBBC04", "#34A853"]
      direction: 45deg
    inactive_color:
      colors: ["#4285F4", "#EA4335", "#FBBC04", "#34A853"]
      direction: 45deg

  # Google Gemini Pro - Alternative match (if title contains "Google")
  - match: Title
    name: "Google"
    active_color:
      colors: ["#4285F4", "#EA4335", "#FBBC04", "#34A853"]
      direction: 45deg
    inactive_color:
      colors: ["#4285F4", "#EA4335", "#FBBC04", "#34A853"]
      direction: 45deg

  # IntelliJ IDEA - Red/Orange (left) + Blue (right)
  - match: Process
    name: "idea64"
    active_color:
      colors: ["#ff6b35", "#087cfa"]
      direction: 45deg
    inactive_color:
      colors: ["#ff6b35", "#087cfa"]
      direction: 45deg

  # DataGrip - Green (left) + Purple (middle) + Blue (right) - 3 colors
  - match: Process
    name: "datagrip64"
    active_color:
      colors: ["#22d88f", "#9775fa", "#087cfa"]
      direction: 45deg
    inactive_color:
      colors: ["#22d88f", "#9775fa", "#087cfa"]
      direction: 45deg

  # WebStorm - Blue (left) + Yellow (right)
  - match: Process
    name: "webstorm64"
    active_color:
      colors: ["#07c3f2", "#fcb900"]
      direction: 45deg
    inactive_color:
      colors: ["#07c3f2", "#fcb900"]
      direction: 45deg

  # Postman - Orange gradient
  - match: Process
    name: "Postman"
    active_color:
      colors: ["#FF6C37", "#FF9500"]
      direction: 45deg
    inactive_color:
      colors: ["#FF6C37", "#FF9500"]
      direction: 45deg

  # Docker Desktop - Deep mysterious blue gradient
  - match: Process
    name: "Docker Desktop"
    active_color:
      colors: ["#0db7ed", "#003f7f"]
      direction: 45deg
    inactive_color:
      colors: ["#0db7ed", "#003f7f"]
      direction: 45deg

  # VS Code - Microsoft blue gradient
  - match: Process
    name: "Code"
    active_color:
      colors: ["#007acc", "#005a9e"]
      direction: 45deg
    inactive_color:
      colors: ["#007acc", "#005a9e"]
      direction: 45deg

  # Cursor - Black to white contrast
  - match: Process
    name: "Cursor"
    active_color:
      colors: ["#000000", "#ffffff"]
      direction: 45deg
    inactive_color:
      colors: ["#000000", "#ffffff"]
      direction: 45deg

  # Perplexity - Teal to bright cyan
  - match: Process
    name: "Perplexity- Ask Anything"
    active_color:
      colors: ["#20b2aa", "#00ffff"]
      direction: 45deg
    inactive_color:
      colors: ["#20b2aa", "#00ffff"]
      direction: 45deg

  # Microsoft PC Manager - Green + Blue from logo
  - match: Process
    name: "Microsoft PC Manager"
    active_color:
      colors: ["#00d4aa", "#0078d4"]
      direction: 45deg
    inactive_color:
      colors: ["#00d4aa", "#0078d4"]
      direction: 45deg

  # Task Manager - Windows system colors
  - match: Process
    name: "Taskmgr"
    active_color:
      colors: ["#0078d4", "#106ebe"]
      direction: 45deg
    inactive_color:
      colors: ["#0078d4", "#106ebe"]
      direction: 45deg

  # File Explorer - 80% Yellow + 20% Blue at bottom
  - match: Process
    name: "explorer"
    active_color:
      colors: ["#ffc83d", "#ffc83d", "#ffc83d", "#ffc83d", "#0078d4"]
      direction: 45deg
    inactive_color:
      colors: ["#ffc83d", "#ffc83d", "#ffc83d", "#ffc83d", "#0078d4"]
      direction: 45deg

  # Kiro Code - Purple theme
  - match: Process
    name: "Kiro"
    active_color:
      colors: ["#8b5cf6", "#a855f7"]
      direction: 45deg
    inactive_color:
      colors: ["#8b5cf6", "#a855f7"]
      direction: 45deg

  # Microsoft Edge - Corrected logo colors (Blue dominant, Green, Yellow, Orange/Red)
  - match: Process
    name: "msedge"
    active_color:
      colors: ["#0078d4", "#0078d4", "#00d4aa", "#ffb900", "#ff8c00"]
      direction: 45deg
    inactive_color:
      colors: ["#0078d4", "#0078d4", "#00d4aa", "#ffb900", "#ff8c00"]
      direction: 45deg

  # Disabled windows
  - match: Class
    name: "Windows.UI.Core.CoreWindow"
    enabled: False

  - match: Class
    name: "XamlExplorerHostIslandWindow"
    enabled: False

  - match: Process
    name: "tacky-borders"
    enabled: False

  - match: Process
    name: "zebar"
    enabled: False

  - match: Title
    name: "komorebi-bar"
    enabled: False

  - match: Title
    name: "keyviz"
    enabled: False

  - match: Title
    name: "Picture-in-Picture"
    enabled: False