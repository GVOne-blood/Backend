# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    org.hibernate.SQL: DEBUG
    com.theblood.springfood.actionlog: DEBUG

management:
  zipkin: # Use the "zipkin" Maven profile to have the Spring Cloud Zipkin dependencies
    tracing:
      endpoint: ENC(waYk8CoB8Gw6HftvWwbvaPN2Oy6A1IhzunAB06nPo6RYVjYP68S+QFC7cyXYQgnu) # http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0 # report 100% of traces

spring:
  application:
    name: springfood-action-log
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson:
    serialization:
      indent-output: true
  # security:
  #   oauth2:
  #     client:
  #       provider:
  #         oidc:
  #           issuer-uri: http://localhost:9080/realms/jhipster
  #       registration:
  #         oidc:
  #           client-id: internal
  #           client-secret: internal
  #           scope: openid, profile, email, offline_access # last one for refresh tokens
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${DEFAULT_DATABASE_URL}
    username: ${DEFAULT_DATABASE_USERNAME}
    password: ${DEFAULT_DATABASE_PASSWORD}
    hikari:
      poolName: Hikari
      auto-commit: false
      schema: action_log
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
      default_schema: action_log
    properties:
      hibernate:
        default_schema: action_log
        cache:
          use_second_level_cache: false
          use_query_cache: false

  liquibase:
    enabled: false
    default-schema: action_log
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false

server:
  port: 8094
  # make sure requests the proxy uri instead of the server one
  forward-headers-strategy: native

grpc:
  server:
    port: -1
# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  cache: # Cache configuration
    redis: # Redis configuration
      expiration: 3600 # By default objects stay 1 hour (in seconds) in the cache
      server: redis://${REDIS_URL}
      cluster: false
      connectionMinimumIdleSize: 2

      # server: ENC(waYk8CoB8GyAMfuv4X62NTC9n9AOHt+4STSfjeJ9qCs4CGpU6WjCY/FL1ZHiNRLRnVn2sbOYOsF/ul7NPFYCCEfg0EUwMJHRL244Mt0QoKw=) # redis://localhost:6379,redis://localhost:16379,redis://localhost:26379
      # cluster: true
  # CORS is disabled by default on microservices, as you should access them through a gateway.
  # If you want to enable it, please uncomment the configuration below.
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
    exposed-headers: "*"
    allow-credentials: false
    max-age: 1800
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
apisix:
  api-key: your-api-key
  api-url: your-apisix-url
carbone:
  base-url: ${CARBONE_BASE_URL:http://117.5.148.63:8100/api/v1} # http://10.60.108.80:8100/api/v1
kpi:
  database: postgresql
  datasource:
    url: ENC(waYk8CoB8GzrWIePOex+1XD7YPR0VdL62su1su8n/CqI/YI9sb63r1lceQgoFz3X)
    username: ENC(waYk8CoB8Gx3lW8hbWAlYw==)
    password: ENC(waYk8CoB8GzkxQM2LuhegA==)
  ignore-rest-routes:
    - path: /api/authenticate
      method: POST
  grpc:
    enable: true
  ignore-grpc-methods:
    - AuthenticateService/Authorize
