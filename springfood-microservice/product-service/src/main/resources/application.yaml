server:
  port: 8085
  # Buộc server lắng nghe trên localhost để đảm bảo gateway có thể kết nối qua localhost
  address: 127.0.0.1

spring:
  application:
    name: product-service
  # Load .env file
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DEFAULT_DATABASE_URL}
    username: ${DEFAULT_DATABASE_USERNAME}
    password: ${DEFAULT_DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: springfood_product
        format_sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB        # Max size cho 1 file
      max-request-size: 50MB     # Max size cho cả request
      file-size-threshold: 2KB   # Threshold để ghi vào disk
  redis:
    # Redis Cluster 1 - Shared cho các read-heavy services
    shared:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
      ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
      ssl.key.password: ${KAFKA_SSL_KEY_PASSWORD:}
    consumer:
      group-id: my-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      auto-startup: false  # Disable Kafka listeners (Kafka not running locally)

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false     # Đổi thành false
    hostname: localhost          # Thêm dòng này


  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 phút
      cache-null-values: false
      key-prefix: "product-service:"

security:
  internal:
    auth:
      enabled: false  # Set false để disable authentication (dev only)
      header:
        id: X-User-ID
        username: X-User-Username
        roles: X-User-Roles

grpc:
  server:
    port: 9095
  client:
    shop-service:
      address: 'static://localhost:9090'
      negotiation-type: plaintext

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: prod-images
  max-file-size: 52428800  # 50MB

logging:
  level:
    org.springframework.security: WARN
    org.springframework.security.web.FilterChainProxy: WARN
    org.springframework.security.web.access.ExceptionTranslationFilter: WARN
    org.springframework.security.authentication: WARN

    # === Kafka: tắt toàn bộ log spam ===
    kafka: WARN
    state.change.logger: WARN
    org.apache.kafka: ERROR              # tất cả kafka client (consumer/producer/admin/network)
    org.springframework.kafka: WARN
    org.springframework.kafka.config: WARN
    org.springframework.kafka.listener: WARN
    org.springframework.kafka.core: WARN

    # === Hibernate: tắt SQL/binder/transaction spam ===
    org.hibernate: WARN                  # cha cho mọi hibernate logger
    org.hibernate.SQL: WARN
    org.hibernate.orm: WARN
    org.hibernate.type: WARN
    org.hibernate.stat: WARN
    org.hibernate.engine: WARN
    org.hibernate.cache: WARN

    # Spring Data/JPA
    org.springframework.data.jpa: WARN
    org.springframework.orm.jpa: WARN
    org.springframework.transaction: WARN

    # Connection pool noise
    com.zaxxer.hikari: WARN
    org.apache.tomcat.jdbc: WARN