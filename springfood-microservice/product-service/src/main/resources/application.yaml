server:
  port: 8085
  # Buộc server lắng nghe trên localhost để đảm bảo gateway có thể kết nối qua localhost
  address: 127.0.0.1

spring:
  application:
    name: product-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/product_service
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    # Redis Cluster 1 - Shared cho các read-heavy services
    shared:
      host: localhost
      port: 6379
      password: 123456
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: my-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false     # Đổi thành false
    hostname: localhost          # Thêm dòng này


  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 phút
      cache-null-values: false
      key-prefix: "product-service:"

security:
  internal:
    auth:
      enabled: false  # Set false để disable authentication (dev only)
      header:
        id: X-User-ID
        username: X-User-Username
        roles: X-User-Roles

grpc:
  server:
    port: 9095
  client:
    shop-service:
      address: 'static://localhost:9093'
      negotiation-type: plaintext

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: prod-images
  max-file-size: 52428800  # 50MB

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG
    org.springframework.security.web.access.ExceptionTranslationFilter: DEBUG
    org.springframework.security.authentication: DEBUG