server:
  port: 8083

spring:
  application:
    name: auth-service
#  datasource:
#    driver-class-name: org.postgresql.Driver
#    url: jdbc:postgresql://localhost:5432/user_service
#    username: postgres
#    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  cookie-max-age: 60000  # 1 phút cho cookie
  accessTokenExpiration: 60000  # 1 phút cho access token (test)
  refreshTokenExpiration: 604800000  # 7 ngày cho refresh token
  resetTokenExpiration: 300000  # 5 phút cho reset token
