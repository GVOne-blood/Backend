spring:
  application:
    name: cart-service

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

  redis:
    host: localhost
    port: 6379
    # Redis Cluster 1 - Shared cho các read-heavy services
    shared:
      host: localhost
      port: 6379
      password: ${DEFAULT_DATABASE_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

server:
  port: 8082 # Port cho cart-service
