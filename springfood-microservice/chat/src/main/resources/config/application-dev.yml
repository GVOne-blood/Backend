# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    org.hibernate.SQL: DEBUG
    com.theblood.springfood.chat: DEBUG
    # Disable noisy Kafka connection logs
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka.clients.consumer.internals: ERROR
    # Disable JMX remote logs
    javax.management.remote.rmi: ERROR

management:
  zipkin: # Use the "zipkin" Maven profile to have the Spring Cloud Zipkin dependencies
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0 # report 100% of traces

spring:
  ai:
    mcp:
      server:
        enabled: true
        name: springfood-chat-mcp
        version: 1.0.0
        type: SYNC
        sse-message-endpoint: /mcp/messages
        capabilities:
          tool: true
          resource: false
          prompt: false
    google:
      genai:
        # Get API key from environment variable
        # Get your FREE API key at: https://aistudio.google.com/app/apikey
        api-key: ${GEMINI_API_KEY:your-gemini-api-key-here}
        chat:
          options:
            # Switch to gemini-2.5-flash-lite (available quota: 10 RPM, 250K TPM, 20 RPD)
            # Currently 19/20 RPD on gemini-2.5-flash, switching to lite
            model: gemini-2.5-flash-lite
            temperature: 0.7
            max-output-tokens: 1000
    # Spring AI Chat Memory Repository Configuration
    chat:
      memory:
        repository:
          jdbc:
            # Always initialize schema (create SPRING_AI_CHAT_MEMORY table)
            initialize-schema: always
    vectorstore:
      pgvector:
        # Table + index đã được tạo manually trong DB → tắt auto-init
        # để tránh Spring AI chạy CREATE INDEX với syntax không match
        initialize-schema: false
  sql:
    init:
      mode: always
      schema-locations: classpath:vector-store-schema.sql
      continue-on-error: true
  websocket:
    # CORS configuration for WebSocket
    allowed-origins: "http://localhost:4200,http://localhost:8080,http://127.0.0.1:4200"
  cache:
    type: simple  # Use in-memory cache instead of Redis
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson:
    serialization:
      indent-output: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${DEFAULT_DATABASE_URL}
    username: ${DEFAULT_DATABASE_USERNAME}
    password: ${DEFAULT_DATABASE_PASSWORD}
    hikari:
      poolName: Hikari
      auto-commit: false
      schema: springfood_chat
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    properties:
      hibernate:
        default_schema: springfood_chat
  liquibase:
    # DISABLE Liquibase - schema already exists
    enabled: false
    # Schema cho Liquibase (nếu cần enable lại)
    default-schema: springfood_chat
    liquibase-schema: springfood_chat
    # Remove 'faker' if you do not want the sample data to be loaded automatically
    contexts: dev, faker
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false

  # ===================================================================
  # KAFKA CONFIGURATION FOR MESSAGE DISTRIBUTION
  # ===================================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all  # Required for idempotent producer (enable.idempotence=true)
      properties:
        enable.idempotence: true  # Prevent duplicate messages
        max.in.flight.requests.per.connection: 5  # Maintain ordering with idempotence
        security.protocol: ${KAFKA_SECURITY_PROTOCOL}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD}
        ssl.key.password: ${KAFKA_SSL_KEY_PASSWORD}
        ssl.endpoint.identification.algorithm: https
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false  # Manual commit for at-least-once delivery
      max-poll-records: 100  # Batch size for persistence consumer
      auto-startup: true  # Enable Kafka consumer listeners
      properties:
        spring.json.trusted.packages: "*"  # Trust all packages for JSON deserialization
        security.protocol: ${KAFKA_SECURITY_PROTOCOL}
        ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION}
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
        ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION}
        ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD}
        ssl.key.password: ${KAFKA_SSL_KEY_PASSWORD}
    listener:
      ack-mode: manual  # Manual acknowledgment for better control

  # ===================================================================
  # REDIS CONFIGURATION FOR TYPING INDICATORS & CACHING
  # ===================================================================
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      ssl:
        enabled: ${REDIS_SSL_ENABLED}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

server:
  port: 9098
  # make sure requests the proxy uri instead of the server one
  forward-headers-strategy: native

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  cache: # Cache configuration
    redis: # Redis configuration
      expiration: 3600 # By default objects stay 1 hour (in seconds) in the cache
      server: redis://localhost:6379
      cluster: false
      # server: redis://localhost:6379,redis://localhost:16379,redis://localhost:26379
      # cluster: true
  # CORS is disabled by default on microservices, as you should access them through a gateway.
  # If you want to enable it, please uncomment the configuration below.
  # cors:
  #   allowed-origins: "http://localhost:9000,https://localhost:9000"
  #   allowed-methods: "*"
  #   allowed-headers: "*"
  #   exposed-headers: "Authorization,Link,X-Total-Count"
  #   allow-credentials: true
  #   max-age: 1800
  security:
    authentication:
      jwt:
        # Use JWT secret from .env file (same as authentication service)
        # Default value if .env not found
        base64-secret: ${JWT_SECRET_KEY:4dVgNvOxWTz2PKJZqCYFoh+AXX0l2OVHoCTfN9ZdXGs=}
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# Config này để thỏa mãn dependency util.com.theblood.springfood.common.JwtUtil
app:
  jwt:
    secretKey: ${JWT_SECRET_KEY:4dVgNvOxWTz2PKJZqCYFoh+AXX0l2OVHoCTfN9ZdXGs=}
    refreshKey: ${JWT_REFRESH_KEY:4dVgNvOxWTz2PKJZqCYFoh+AXX0l2OVHoCTfN9ZdXGs=}
    resetKey: ${JWT_RESET_KEY:RKyKtM34VufukHK6sSPlQdDA8wBOHCYUygwIp6Fekco=}

# ===================================================================
# EUREKA CLIENT CONFIGURATION
# ===================================================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}



# ===================================================================
# Client Module Configuration (gRPC + REST)
# ===================================================================
springfood:
  client:
    enabled: true
    default-protocol: grpc

    services:
      product:
        enabled: true
        protocol: grpc

      shop:
        enabled: true
        protocol: grpc

      order:
        enabled: true
        protocol: grpc

# ===================================================================
# gRPC Configuration (Server + Client)
# ===================================================================
grpc:
  # gRPC Server Configuration
  server:
    port: 9100  # gRPC port for chat service
  
  # gRPC Client Configuration
  client:
    product-service:
      address: dns:///localhost:9090
      negotiation-type: plaintext
    shop-service:
      address: dns:///localhost:9091
      negotiation-type: plaintext
    order-service:
      address: dns:///localhost:9092
      negotiation-type: plaintext
