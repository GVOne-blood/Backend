spring:
  ai:
    # Disable Vertex AI (we're using direct Google AI API instead)
    vertex:
      ai:
        gemini:
          enabled: false
          project-id: dummy-project
          location: us-central1
    
    # Google AI Gemini Configuration (Direct API - simpler than Vertex AI)
    # Requires GEMINI_API_KEY in .env file
    google:
      ai:
        gemini:
          api-key: ${GEMINI_API_KEY}
          model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
          # Optional: temperature, top-p, top-k, max-output-tokens
    
    # Vector Store Configuration
    vectorstore:
      pgvector:
        schema-name: springfood_chat
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        # Table + index đã tạo manually trong DB → tắt auto-init
        # (Spring AI 1.x bug: CREATE INDEX trước CREATE TABLE khi schema khác public)
        initialize-schema: false
