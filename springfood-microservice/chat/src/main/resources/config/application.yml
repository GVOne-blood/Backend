  mail:
    from: chat@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Chat API
    description: Chat API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:

