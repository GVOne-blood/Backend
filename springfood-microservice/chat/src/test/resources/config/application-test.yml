# ===================================================================
# Spring Boot configuration for the "test" profile.
#
# This configuration is used for integration tests.
# ===================================================================

logging:
  level:
    ROOT: INFO
    com.theblood.springfood.chat: DEBUG
    org.springframework.kafka: WARN
    org.springframework.web.socket: DEBUG

spring:
  cache:
    type: simple
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:tc:postgresql:15-alpine:///springfood?TC_TMPFS=/testtmpfs:rw
    username: postgres
    password: 123456
    hikari:
      poolName: Hikari
      auto-commit: false
  jpa:
    properties:
      hibernate:
        default_schema: springfood_chat
    show-sql: false
  liquibase:
    default-schema: springfood_chat
    liquibase-schema: springfood_chat
    contexts: test
  
  # ===================================================================
  # KAFKA CONFIGURATION FOR TESTING
  # ===================================================================
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: manual
  
  # ===================================================================
  # REDIS CONFIGURATION FOR TESTING
  # ===================================================================
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      timeout: 2000ms

server:
  port: 0  # Random port for tests

# ===================================================================
# WebSocket Configuration for Testing
# ===================================================================
websocket:
  allowed-origins: '*'

