<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Test - SpringFood</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .status {
            padding: 10px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #dc3545;
        }

        .status-dot.connected {
            background: #28a745;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #667eea;
        }

        .message.ai .message-avatar {
            background: #764ba2;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
        }

        .token-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            border-color: #667eea;
        }

        .send-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .send-button:hover {
            transform: scale(1.05);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            color: #666;
            font-style: italic;
        }

        .typing-indicator.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Assistant - SpringFood</h1>
            <p>Powered by Google Gemini & Spring AI</p>
        </div>

        <div class="status">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <button onclick="clearHistory()" style="padding: 5px 15px; border: none; background: #dc3545; color: white; border-radius: 5px; cursor: pointer;">
                Clear History
            </button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message ai">
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    Xin chào! Tôi là trợ lý AI của SpringFood. Tôi có thể giúp gì cho bạn hôm nay? 😊
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            AI đang trả lời...
        </div>

        <div class="input-container">
            <div style="width: 100%;">
                <input
                    type="text"
                    id="tokenInput"
                    class="token-input"
                    placeholder="Nhập JWT token (Bearer token từ login)"
                />
                <div style="display: flex; gap: 10px;">
                    <input
                        type="text"
                        id="messageInput"
                        class="message-input"
                        placeholder="Nhập tin nhắn..."
                        onkeypress="handleKeyPress(event)"
                    />
                    <button class="send-button" onclick="sendMessage()" id="sendButton">
                        Gửi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let stompClient = null;
        let conversationId = generateUUID();
        let currentAIMessage = '';

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function connect() {
            const token = document.getElementById('tokenInput').value.trim();
            if (!token) {
                alert('Vui lòng nhập JWT token!');
                return;
            }

            const socket = new SockJS('http://localhost:9098/ws-sockjs');
            stompClient = Stomp.over(socket);

            stompClient.connect(
                { Authorization: `Bearer ${token}` },
                function(frame) {
                    console.log('Connected:', frame);
                    updateStatus(true);

                    // Subscribe to AI responses
                    stompClient.subscribe('/user/queue/ai-assistant/response', function(message) {
                        currentAIMessage += message.body;
                        updateAIMessage(currentAIMessage);
                    });

                    stompClient.subscribe('/user/queue/ai-assistant/complete', function(message) {
                        console.log('AI completed:', message.body);
                        finalizeAIMessage();
                    });

                    stompClient.subscribe('/user/queue/ai-assistant/error', function(message) {
                        console.error('AI error:', message.body);
                        appendMessage('AI', message.body, true);
                        hideTyping();
                    });
                },
                function(error) {
                    console.error('Connection error:', error);
                    updateStatus(false);
                    alert('Không thể kết nối! Kiểm tra JWT token và server.');
                }
            );
        }

        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            updateStatus(false);
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();

            if (!message) return;

            if (!stompClient || !stompClient.connected) {
                connect();
                setTimeout(() => sendMessage(), 1000);
                return;
            }

            // Display user message
            appendMessage('User', message);
            messageInput.value = '';

            // Show typing indicator
            showTyping();
            currentAIMessage = '';

            // Send to AI
            stompClient.send('/app/ai-assistant/chat', {}, JSON.stringify({
                message: message,
                conversationId: conversationId
            }));
        }

        function appendMessage(sender, content, isError = false) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender.toLowerCase()}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = sender === 'User' ? 'U' : 'AI';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            if (isError) contentDiv.style.background = '#f8d7da';

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function updateAIMessage(content) {
            const chatContainer = document.getElementById('chatContainer');
            let lastMessage = chatContainer.querySelector('.message.ai:last-child .message-content');

            if (!lastMessage || lastMessage.dataset.finalized === 'true') {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message ai';

                const avatar = document.createElement('div');
                avatar.className = 'message-avatar';
                avatar.textContent = 'AI';

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = content;

                messageDiv.appendChild(avatar);
                messageDiv.appendChild(contentDiv);
                chatContainer.appendChild(messageDiv);
                lastMessage = contentDiv;
            } else {
                lastMessage.textContent = content;
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function finalizeAIMessage() {
            const chatContainer = document.getElementById('chatContainer');
            const lastMessage = chatContainer.querySelector('.message.ai:last-child .message-content');
            if (lastMessage) {
                lastMessage.dataset.finalized = 'true';
            }
            hideTyping();
            currentAIMessage = '';
        }

        function showTyping() {
            document.getElementById('typingIndicator').classList.add('active');
        }

        function hideTyping() {
            document.getElementById('typingIndicator').classList.remove('active');
        }

        function updateStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const sendButton = document.getElementById('sendButton');

            if (connected) {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
                sendButton.disabled = false;
            } else {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                sendButton.disabled = true;
            }
        }

        function clearHistory() {
            conversationId = generateUUID();
            document.getElementById('chatContainer').innerHTML = `
                <div class="message ai">
                    <div class="message-avatar">AI</div>
                    <div class="message-content">
                        Lịch sử đã được xóa. Bắt đầu cuộc trò chuyện mới! 😊
                    </div>
                </div>
            `;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Auto-connect if token exists
        window.onload = function() {
            const savedToken = localStorage.getItem('jwt_token');
            if (savedToken) {
                document.getElementById('tokenInput').value = savedToken;
            }
        };

        // Save token on change
        document.getElementById('tokenInput').addEventListener('change', function() {
            localStorage.setItem('jwt_token', this.value);
        });
    </script>
</body>
</html>
